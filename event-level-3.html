<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 3 - Website Pendaftaran Event</title>
</head>

<body>
    <!--
        TANTANGAN HTML LEVEL 3: WEBSITE PENDAFTARAN EVENT / LOMBA
        Gunakan semua tag dari Level 1 & Level 2 + tag Form baru!

        Checklist Tag Lama:
        [ ] Heading bertingkat (<h1>, <h2>, <h3>)
        [ ] Link navigasi internal (#info, #jadwal, #peraturan, #daftar), link ke Level 1/2, & gambar yang bisa diklik
        [ ] Minimal 2 gambar ukuran berbeda (<img>)
        [ ] Paragraf (<p>) + <br> pada info panitia/alamat & form
        [ ] Tabel kompleks >= 4 kolom (ada colspan/rowspan, <img> & <br> di dalam <td>)
        [ ] Nested List (<ul> / <ol> di dalam <li>)

        Checklist Tag Baru (Level 3):
        [ ] <form> membungkus seluruh formulir
        [ ] Input biasa: type="text", type="email", type="number" (atau type="tel")
        [ ] Input radio: type="radio" dengan atribut name yang sama
        [ ] Input checklist: type="checkbox" (minimal 2 pilihan + 1 persetujuan)
        [ ] <textarea> untuk alamat / alasan / catatan
        [ ] <button type="submit"> dan <button type="reset">
    -->

    <!-- 1. HEADER & NAVIGASI CEPAT -->
    <!-- Buat <h1> nama event, slogan, dan link ke #info, #jadwal, #peraturan, #daftar -->


    <hr>

    <!-- 2. INFO EVENT (beri id="info") -->
    <!-- Pasang gambar banner + <h2> + minimal 2 paragraf penjelasan event -->


    <hr>

    <!-- 3. JADWAL & HADIAH - TABEL KOMPLEKS (beri id="jadwal") -->
    <!-- Buat <table> dengan border="1", minimal 4 kolom, colspan/rowspan, serta <img> dan <br> di dalam <td> -->


    <hr>

    <!-- 4. PERATURAN & PERLENGKAPAN - NESTED LIST (beri id="peraturan") -->
    <!-- Buat <h2> & <h3>, lalu buat list di dalam list (<ul> atau <ol> di dalam <li>) -->


    <hr>

    <!-- 5. FORMULIR PENDAFTARAN (beri id="daftar") -->
    <!-- Buat <h2>Formulir Pendaftaran</h2> lalu tag <form>:
         - Input biasa (text, email, number)
         - Input radio (pilih 1 kategori)
         - Input checkbox / checklist (pilih lebih dari 1 sesi/minat + setuju aturan)
         - Textarea (alamat / catatan)
         - Button submit & reset -->


    <hr>

    <!-- 6. KONTAK PANITIA & TAUTAN LEVEL SEBELUMNYA -->
    <!-- Gunakan <br> untuk alamat/kontak panitia, gambar yang bisa diklik (<a><img></a>),
         dan link menuju file Level 1 & Level 2 -->


</body>

</html>
