<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 2 - Website Restoran Impian</title>
</head>

<body>
    <!--
        TANTANGAN HTML LEVEL 2: WEBSITE KEDAI / RESTORAN IMPIAN
        Gunakan HANYA tag dasar yang sama dengan Level 1, tapi dibuat lebih menantang!

        Checklist Level 2:
        [ ] Heading bertingkat: <h1>, <h2>, dan <h3>
        [ ] Link navigasi internal (href="#id-bagian") menuju bagian di halaman yang sama
        [ ] Gambar yang bisa diklik sebagai link (<a> membungkus <img>)
        [ ] Link menuju file Level 1 (misal: ./data-diri.html atau ./contoh-data-diri.html)
        [ ] Minimal 2 gambar dengan ukuran berbeda (misal: banner besar & foto menu kecil)
        [ ] Minimal 2 paragraf cerita kedai + <br> untuk daftar alamat cabang & jam buka
        [ ] Tabel >= 4 kolom, ada <img> & <br> di dalam <td>, dan pakai colspan atau rowspan
        [ ] List bersarang (Nested List): <ul> atau <ol> di dalam <li>
    -->

    <!-- 1. HEADER & NAVIGASI CEPAT -->
    <!-- Buat <h1> nama kedai, paragraf slogan, dan link lompat ke #tentang, #menu, #cara-pesan, #lokasi -->


    <hr>

    <!-- 2. TENTANG KAMI (beri id="tentang") -->
    <!-- Pasang gambar banner kedai + <h2>Tentang Kedai</h2> + minimal 2 paragraf cerita -->


    <hr>

    <!-- 3. DAFTAR MENU - TABEL KOMPLEKS (beri id="menu") -->
    <!-- Buat <h2>Daftar Menu</h2> dan <table> dengan border="1" minimal 4 kolom.
         Wajib ada: <img> & <br> di dalam <td>, serta minimal 1 sel pakai colspan atau rowspan -->


    <hr>

    <!-- 4. MENU TAMBAHAN / CARA PESAN - NESTED LIST (beri id="cara-pesan") -->
    <!-- Buat <h2> & <h3>, lalu buat list di dalam list (<ul> atau <ol> di dalam <li>) -->


    <hr>

    <!-- 5. LOKASI, JAM BUKA & PROFIL PEMILIK (beri id="lokasi") -->
    <!-- Gunakan <br> untuk memisahkan alamat beberapa cabang & jam buka.
         Tambahkan gambar yang bisa diklik (<a><img></a>) dan link ke halaman Level 1 -->


</body>

</html>
